[skill]
name = "frontend_verifier_prompt"
version = "1.0"
capability = "frontend_docs_verification"
description = "Compare frontend documentation with actual frontend code and report discrepancies."
content_file = "frontend_verifier.prompt.md"
input_schema = { type = "object", properties = { docs_frontend = { type = "object" }, code_frontend = { type = "object" }, plan = { type = "object" } }, required = ["docs_frontend", "code_frontend"] }
output_schema = { type = "object", properties = { branch = { type = "string" }, findings = { type = "array" }, summary = { type = "object" } }, required = ["branch", "findings", "summary"] }
requires_tools = []
requires_skills = ["orchestrator_prompt"]
preconditions = ["Frontend docs and code summaries are available in payload."]
postconditions = ["A list of frontend discrepancies is produced."]
failure_policy = "retry"
parallelizable = true
