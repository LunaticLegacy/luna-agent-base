[skill]
name = "structure_verifier_prompt"
version = "1.0"
capability = "structure_docs_verification"
description = "Compare structural, API, protocol, and metadata docs with actual code."
content_file = "structure_verifier.prompt.md"
input_schema = { type = "object", properties = { docs_structure = { type = "object" }, code_structure = { type = "object" }, plan = { type = "object" } }, required = ["docs_structure", "code_structure"] }
output_schema = { type = "object", properties = { branch = { type = "string" }, findings = { type = "array" }, summary = { type = "object" } }, required = ["branch", "findings", "summary"] }
requires_tools = []
requires_skills = ["orchestrator_prompt"]
preconditions = ["Structure docs and code summaries are available in payload."]
postconditions = ["A list of structural discrepancies is produced."]
failure_policy = "retry"
parallelizable = true
