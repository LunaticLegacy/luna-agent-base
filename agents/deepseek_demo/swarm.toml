[swarm]
name = "deepseek_demo"
graph_file = "graph.py"
agent_files = [
  "agents/requirement_analyst.py",
  "agents/coder.py",
  "agents/reviewer.py",
  "agents/summarizer.py",
]
skill_files = [
  "skills/requirement_analyst.prompt.md",
  "skills/coder.prompt.md",
  "skills/reviewer.prompt.md",
  "skills/summarizer.prompt.md",
]
tool_files = [
  "tools.file_reader_tool",
  "tools.file_editor_tool",
  "tools.file_writer_tool",
  "tools.command_runner_tool",
  "tools.search_tool",
]

[tool_capabilities]
file_reader = ["file_read"]
file_editor = ["file_write"]
file_writer = ["file_write"]
command_runner = ["command_execute"]
search = ["file_read"]

[llm.default]
name = "deepseek"
provider = "openai"
api_url = "https://api.deepseek.com"
api_key = "${DEEPSEEK_API_KEY}"
model = "deepseek-reasoner"

[workspace]
default_mode = "workspace"
default_root = "."
