[skill]
name = "reviewer_prompt"
version = "1.0"
capability = "review_and_route"
description = "Review the draft and emit a routing decision for the demo workflow."
content_file = "reviewer.prompt.md"
input_schema = { input = "string" }
output_schema = { verdict = "string", branch = "string", feedback = "string", content = "string", next_node_ids = "array" }
requires_tools = []
requires_skills = ["writer_prompt"]
preconditions = ["A draft or merged branch payload is available."]
postconditions = ["The executor can follow the routing instruction."]
failure_policy = "retry"
parallelizable = false
