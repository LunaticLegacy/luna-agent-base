[skill]
name = "writer_prompt"
version = "1.0"
capability = "drafting"
description = "Compose a concise draft from merged planning and research context."
content_file = "writer.prompt.md"
input_schema = { input = "string" }
output_schema = { draft = "string" }
requires_tools = ["echo", "file_writer"]
requires_skills = ["planner_prompt", "researcher_prompt"]
preconditions = ["Planning and research context are available."]
postconditions = ["A structured draft has been produced."]
failure_policy = "retry"
parallelizable = false
