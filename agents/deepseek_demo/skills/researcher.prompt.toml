[skill]
name = "researcher_prompt"
version = "1.0"
capability = "evidence_gathering"
description = "Collect concise evidence and assumptions for the swarm."
content_file = "researcher.prompt.md"
input_schema = { input = "string" }
output_schema = { findings = "array", assumptions = "array", risks = "array" }
requires_tools = []
requires_skills = ["planner_prompt"]
preconditions = ["The planner has produced a request summary."]
postconditions = ["Evidence is concise and reusable by writer/reviewer."]
failure_policy = "retry"
parallelizable = true
