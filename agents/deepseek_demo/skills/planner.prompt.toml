[skill]
name = "planner_prompt"
version = "1.0"
capability = "runtime_orchestration_planning"
description = "Produce a JSON control plan for content preservation, agent spawning, and live graph surgery."
content_file = "planner.prompt.md"
input_schema = { input = "string" }
output_schema = { content = "string", spawn = "object", graph_edit = "object", cleanup = "object" }
requires_tools = ["agent_manager", "graph_editor"]
requires_skills = []
preconditions = ["A user request is available.", "The runtime graph is loaded."]
postconditions = ["A structured control plan is ready for runtime execution."]
failure_policy = "retry"
parallelizable = true
