[app]
swarm_root = "agents"

[api]
base_url = "/api"
timeout_seconds = 120
sse_reconnect_interval_seconds = 5
auto_reconnect = true
require_auth = false
api_token_env = "ANGELUS_API_TOKEN"
cors_allowed_origins = ["http://localhost:4200", "http://127.0.0.1:4200", "http://localhost:5173", "http://127.0.0.1:5173"]
